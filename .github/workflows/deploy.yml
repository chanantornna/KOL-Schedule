name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions required for GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ----- Build main app (kol-schedule) at site root -----
      - name: Install root dependencies
        run: npm ci

      - name: Build root app
        # Base path must match "/<repo-name>/" for project Pages sites.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # ----- Build scoring app into /scoring subpath -----
      - name: Install scoring-app dependencies
        working-directory: scoring-app
        run: npm ci

      - name: Build scoring app
        working-directory: scoring-app
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/scoring/

      - name: Combine build output
        # Copy scoring-app build into dist/scoring so both apps ship together.
        run: |
          mkdir -p dist/scoring
          cp -r scoring-app/dist/* dist/scoring/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
